services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - mitaines-data:/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/mitaines.db
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mitaines-data:
